apiVersion: v1
data:
  ALLOW_SIGNUP: "false"
  BASE_URL: https://mealie.example.com
  PGID: 1000
  PUID: 1000
  TZ: America/Anchorage
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/name: mealie
  name: mealie
  namespace: mealie
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/name: mealie
  name: mealie
  namespace: mealie
spec:
  ports:
  - name: http
    port: 9000
    protocol: TCP
    targetPort: 9000
  selector:
    app.kubernetes.io/component: app
    app.kubernetes.io/name: mealie
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/name: mealie
  name: mealie
  namespace: mealie
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/name: mealie
  name: mealie
  namespace: mealie
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: app
      app.kubernetes.io/name: mealie
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: app
        app.kubernetes.io/name: mealie
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: mealie
        image: ghcr.io/mealie-recipes/mealie:v3.10.2
        imagePullPolicy: IfNotPresent
        name: mealie
        ports:
        - containerPort: 9000
          name: http
        readinessProbe:
          httpGet:
            path: /api/app/about
            port: 9000
            scheme: HTTP
        volumeMounts:
        - mountPath: /app/data
          name: storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: mealie
